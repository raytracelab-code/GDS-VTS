<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDS VTS Photo Upload</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e7eaec;color:#17263a;font:16px system-ui,sans-serif}main{max-width:480px;margin:24px auto;padding:24px;background:white;border:1px solid #d8e0e8;border-radius:16px}header{font-weight:700;color:#1e3a5f;letter-spacing:1px}h1{font-size:24px;margin:18px 0 8px}.hint{color:#65758a;font-size:14px;line-height:1.5}.target{background:#f0f5f7;padding:14px;border-radius:8px;margin:20px 0}input{position:absolute;width:1px;height:1px;opacity:0}.choices{display:flex;gap:12px}.choice,button{display:block;padding:15px 12px;border:1px solid #c7d2dd;border-radius:8px;text-align:center;cursor:pointer;font:600 16px system-ui}.choice{flex:1;color:#1e3a5f}button{width:100%;background:#1e3a5f;color:white;margin-top:16px;min-height:50px}button:disabled{opacity:.5;cursor:default}img{display:none;width:100%;max-height:340px;object-fit:contain;margin-top:20px;border-radius:8px}#status{line-height:1.5;overflow-wrap:anywhere}input:focus-visible+label{outline:3px solid #14b8a6}</style></head>
<body><main><header>GDS VTS</header><h1>VJR Back Deck Photo Upload</h1><p class="hint">Keep this phone and the PC on the same Wi-Fi or LAN. JPEG and PNG photos up to 15 MB are supported.</p><div class="target"><small>PHOTO TYPE</small><p><strong>@@TARGET@@</strong></p></div>
<div class="choices"><input id="camera" type="file" accept="image/jpeg,image/png" capture="environment"><label class="choice" for="camera">Take Photo</label><input id="gallery" type="file" accept="image/jpeg,image/png"><label class="choice" for="gallery">Choose Photo</label></div>
<img id="preview" alt="Selected photo preview"><button id="upload" disabled>Upload Photo</button><p id="status" role="status" aria-live="polite">Choose or take a photo to begin.</p></main>
<script>
const camera=document.getElementById('camera'),gallery=document.getElementById('gallery'),preview=document.getElementById('preview'),upload=document.getElementById('upload'),status=document.getElementById('status');let selected=null,previewUrl=null;
function choose(event){const file=event.target.files[0];if(!file)return;selected=null;upload.disabled=true;if(file.size>15*1024*1024){status.textContent='Photo exceeds maximum allowed size.';return}if(!/\.(jpe?g|png)$/i.test(file.name)){status.textContent='Choose a JPEG or PNG photo.';return}selected=file;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.style.display='block';status.textContent='Photo ready. Tap Upload Photo.';upload.disabled=false}
camera.addEventListener('change',choose);gallery.addEventListener('change',choose);
upload.addEventListener('click',async()=>{if(!selected)return;upload.disabled=true;camera.disabled=gallery.disabled=true;status.textContent='Uploading photo… Please keep this page open.';try{const response=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':selected.type||'application/octet-stream','X-Photo-Name':encodeURIComponent(selected.name)},body:selected});const result=await response.json();status.textContent=result.message;if(response.ok){selected=null;upload.textContent='Uploaded';return}if(response.status===410||response.status===404){selected=null;return}}catch(error){status.textContent='Could not connect. Check the same Wi-Fi/LAN, the selected PC address and Windows Firewall on Private networks.'}upload.disabled=!selected;camera.disabled=gallery.disabled=false});
</script></body></html>
